services:
  postgres:
    image: postgres:16-alpine
    container_name: postpulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postpulse}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c max_connections=100
      -c min_wal_size=100MB
      -c max_wal_size=1GB
      -c random_page_cost=1.1

volumes:
  postpulse_pgdata:
    name: postpulse_pgdata
